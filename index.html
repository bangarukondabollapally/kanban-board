<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban Board</div>
            <div class="right">
                <button class="toggle-modal">Add New Task</button>
            </div>
        </nav>

        <section class="board">
            <div id="todo" class="columns">
                <div class="header">
                    <div class="left">TODO</div>
                    <div class="right">Tasks: <span class="count">0</span></div>
                </div>
                <!-- <div class="card task" draggable="true">
                    <h2>Task 1</h2>
                    <p>Description of task</p>
                    <div class="buttons">
                        <button class="del-btn">Delete</button>
                    </div>
                </div> -->
            </div>
            <div id="progress" class="columns">
                <div class="header">
                    <div class="left">In-Progress</div>
                    <div class="right">Tasks: <span class="count">0</span></div>
                </div>
            </div>
            <div id="done" class="columns">
                <div class="header">
                    <div class="left">Done</div>
                    <div class="right">Tasks: <span class="count">0</span></div>
                </div>
            </div>
        </section>
    </main>  
    
    <div class="modal new-task">
        <div class="center">
            <input type="text" id="task-title" placeholder="Task Title">
            <textarea id="task-description" placeholder="Description"></textarea>
            <div class="button">
                <button class="add-task-btn">Add Task</button>
                <button class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
